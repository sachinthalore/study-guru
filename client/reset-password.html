
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | Study Guru</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f8faff;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #101828;
    }

    .reset-card {
      width: 100%;
      max-width: 430px;
      padding: 32px;
      background: #fff;
      border: 1px solid #eaecf0;
      border-radius: 20px;
      box-shadow: 0 12px 35px rgba(16, 24, 40, 0.08);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    .brand-icon {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #7040ed, #12a8e8);
      color: white;
      font-weight: 800;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px;
      letter-spacing: -0.8px;
    }

    .subtitle {
      margin: 0 0 26px;
      color: #667085;
      font-size: 14px;
      line-height: 1.6;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-size: 13px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d0d5dd;
      border-radius: 10px;
      outline: none;
      font: inherit;
    }

    input:focus {
      border-color: #7040ed;
      box-shadow: 0 0 0 3px rgba(112, 64, 237, 0.12);
    }

    .submit-btn {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: linear-gradient(100deg, #7040ed, #129fe5);
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .submit-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    #resetMessage {
      margin-top: 16px;
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .back-link {
      display: block;
      margin-top: 22px;
      color: #6842dc;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
    }

    
#resetPasswordForm .password-input-wrap {
  position: relative !important;
  display: block !important;
  width: 100% !important;
}

#resetPasswordForm .password-input-wrap input {
  display: block !important;
  width: 100% !important;
  padding-right: 44px !important;
}

#resetPasswordForm .password-input-wrap button.password-toggle {
  position: absolute !important;
  top: 50% !important;
  right: 12px !important;
  left: auto !important;
  bottom: auto !important;
  transform: translateY(-50%) !important;
  width: 32px !important;
  height: 32px !important;
  font-size: 18px;
  margin: 0 !important;
  padding: 0 !important;
  border: none !important;
  background: transparent !important;
  appearance: none !important;
  z-index: 5 !important;
}

  </style>
</head>

<body>
  <main class="reset-card">
    <div class="brand">
      <div class="brand-icon">SG</div>
      <div>
        <strong>Study Guru</strong>
        <div style="margin-top: 4px; color: #667085; font-size: 12px;">
          Your AI Study Companion
        </div>
      </div>
    </div>

    <h1>Reset your password</h1>
    <p class="subtitle">
      Create a new password for your Study Guru account.
    </p>

    <form id="resetPasswordForm">
        
        <label for="newPassword">New password</label>
        <div class="password-input-wrap">
          <input
            type="password"
            id="newPassword"
            autocomplete="new-password"
            minlength="8"
            maxlength="50"
            required
          />
          <button
            type="button"
            class="password-toggle"
            data-password-target="newPassword"
            aria-label="Show password"
            title="Show password"
          >🙈</button>
        </div>
        

        
        <label for="confirmPassword">Confirm new password</label>
        <div class="password-input-wrap">
          <input
            type="password"
            id="confirmPassword"
            autocomplete="new-password"
            minlength="8"
            maxlength="50"
            required
          />
          <button
            type="button"
            class="password-toggle"
            data-password-target="confirmPassword"
            aria-label="Show password"
            title="Show password"
          >🙈</button>
        </div>
        

      <button class="submit-btn" id="resetSubmitBtn" type="submit">
        Reset password
      </button>

      <p id="resetMessage" role="status" aria-live="polite"></p>
    </form>

    <a class="back-link" href="./index.html">← Back to sign in</a>
  </main>

  <script>
    const form = document.getElementById("resetPasswordForm");
    const message = document.getElementById("resetMessage");
    const submitBtn = document.getElementById("resetSubmitBtn");

    const token = new URLSearchParams(window.location.search).get("token");

    const API_BASE_URL =
      window.location.hostname === "localhost" ||
      window.location.hostname === "127.0.0.1"
        ? "http://localhost:3000"
        : "";

        
document.querySelectorAll("[data-password-target]").forEach((button) => {
  button.addEventListener("click", () => {
    const input = document.getElementById(button.dataset.passwordTarget);
    if (!input) return;

    const showPassword = input.type === "password";
    input.type = showPassword ? "text" : "password";

    button.textContent = showPassword ? "👁️" : "🙈";
    button.setAttribute(
      "aria-label",
      showPassword ? "Hide password" : "Show password"
    );
    button.setAttribute(
      "title",
      showPassword ? "Hide password" : "Show password"
    );
  });
});


    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const password = document.getElementById("newPassword").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (!token || token === "reset-password") {
        message.style.color = "#dc2626";
        message.textContent = "Invalid reset link. Please request a new one.";
        return;
      }

      if (password !== confirmPassword) {
        message.style.color = "#dc2626";
        message.textContent = "Passwords do not match.";
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Resetting...";
      message.textContent = "";

      try {
        const response = await fetch(
          `${API_BASE_URL}/api/v1/auth/reset-password/${encodeURIComponent(token)}`,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ password })
          }
        );

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(data.message || "Unable to reset password.");
        }

        message.style.color = "#15803d";
        message.textContent =
          data.message || "Password reset successful. You can now sign in.";

        form.reset();
        submitBtn.textContent = "Password reset";

      } catch (error) {
        message.style.color = "#dc2626";
        message.textContent =
          error.message || "Something went wrong. Please try again.";
        submitBtn.disabled = false;
        submitBtn.textContent = "Reset password";
      }
    });
  </script>
</body>
</html>
